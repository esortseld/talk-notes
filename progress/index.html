<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業・アイデア記録 | Talk Notes</title>
  <meta name="description" content="そのとき何をしていたか、何を考えていたかを時系列で残す記憶ログです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#2f3133; --muted:#6b7075; --line:#d9ddd8; --paper:#fffdf8; --accent:#536d5d; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f1e9; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; line-height:1.65; }
    .container { width:min(1100px, calc(100% - 32px)); margin:0 auto; }
    header { padding:48px 0 26px; }
    .kicker { margin:0 0 4px; color:var(--accent); font:1rem "Yomogi",cursive; }
    h1 { margin:0; font-size:clamp(1.8rem,5vw,2.7rem); }
    .description { margin:10px 0 0; color:var(--muted); }
    .back { display:inline-block; margin:0 0 22px; color:var(--accent); text-decoration:none; font-weight:700; }
    .table-wrap { overflow-x:auto; background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.04); margin-bottom:56px; }
    table { width:100%; border-collapse:collapse; min-width:820px; }
    th, td { padding:14px 16px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
    th { background:#f2f3ee; font-size:.92rem; color:var(--muted); white-space:nowrap; }
    tr:last-child td { border-bottom:none; }
    td:first-child { white-space:nowrap; color:var(--muted); }
    td:nth-child(2), td:nth-child(3) { white-space:nowrap; }
    .note { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <p class="kicker">Memory log</p>
      <h1>作業・アイデア記録</h1>
      <p class="description">その瞬間、何をしていたか・何を考えていたかを残しておくための時系列メモです。</p>
    </div>
  </header>

  <main class="container">
    <a class="back" href="../index.html#notes">← Talk Notesへ戻る</a>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>プロジェクト</th>
            <th>チャット</th>
            <th>内容</th>
            <th>メモ</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2026.9.25 7:06</td>
            <td>ITネッコ</td>
            <td>指示整理案</td>
            <td>ITネッコ項目別生成ページの見直し</td>
            <td>アイデア出しまで</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
