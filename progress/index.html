<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業進捗ログ | Talk Notes</title>
  <meta name="description" content="朝の作業で、何をどこまで進めたかを記録する進捗ログです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#2f3133; --muted:#6b7075; --line:#d9ddd8; --paper:#fffdf8; --accent:#536d5d; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f1e9; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; line-height:1.7; }
    .container { width:min(900px, calc(100% - 32px)); margin:0 auto; }
    header { padding:48px 0 26px; }
    .kicker { margin:0 0 4px; color:var(--accent); font: 1rem "Yomogi", cursive; }
    h1 { margin:0; font-size:clamp(1.8rem,5vw,2.7rem); }
    .description { margin:10px 0 0; color:var(--muted); }
    .back { display:inline-block; margin:0 0 22px; color:var(--accent); text-decoration:none; font-weight:700; }
    .log { display:grid; gap:16px; padding-bottom:56px; }
    .entry { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 4px 14px rgba(0,0,0,.04); }
    .entry time { color:var(--muted); font-size:.92rem; }
    .entry h2 { margin:7px 0 16px; font-size:1.25rem; }
    dl { margin:0; display:grid; grid-template-columns:7em 1fr; gap:8px 12px; }
    dt { font-weight:700; color:var(--muted); }
    dd { margin:0; }
    @media (max-width:600px) { header{padding-top:32px}.entry{padding:18px} dl{grid-template-columns:1fr;gap:2px} dd{margin-bottom:8px} }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <p class="kicker">Progress log</p>
      <h1>作業進捗ログ</h1>
      <p class="description">何をどこまで進めたか、作業を止める時点の状態を残しておくページです。</p>
    </div>
  </header>

  <main class="container">
    <a class="back" href="../index.html#notes">← Talk Notesへ戻る</a>

    <section class="log" aria-label="作業進捗">
      <article class="entry">
        <time datetime="2026-09-25T07:06:00+09:00">2026.9.25 7:06</time>
        <h2>ITネッコ</h2>
        <dl>
          <dt>チャット</dt>
          <dd>指示整理案</dd>
          <dt>内容</dt>
          <dd>ITネッコ項目別生成ページの見直し</dd>
          <dt>到達点</dt>
          <dd>アイデア出しまで</dd>
        </dl>
      </article>
    </section>
  </main>
</body>
</html>
