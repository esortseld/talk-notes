<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Log | Talk Notes</title>
  <meta name="description" content="その瞬間、何をしていたか・何を考えていたかを残しておくための時系列メモです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=20260614-01">
  <style>
    .memory-page { padding: 36px 0 64px; }
    .memory-page h1 { margin-bottom: 8px; }
    .memory-intro { color: #6b7075; margin-bottom: 28px; }
    .memory-log-wrap { overflow-x: auto; background: #fff; border-radius: 16px; }
    .memory-log { width: 100%; min-width: 820px; border-collapse: collapse; }
    .memory-log th, .memory-log td { padding: 14px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid #d9ddd8; }
    .memory-log th { white-space: nowrap; }
    .memory-log td:first-child, .memory-log td:nth-child(2), .memory-log td:nth-child(3) { white-space: nowrap; }
    .back-link { display: inline-block; margin-bottom: 24px; }
  </style>
</head>
<body>
  <main class="container memory-page">
    <a class="back-link" href="../index.html#notes">← Talk Notesへ戻る</a>
    <p class="section-kicker">Memory Log</p>
    <h1>作業・アイデア記録</h1>
    <p class="memory-intro">その瞬間、何をしていたか・何を考えていたかを残しておくための時系列メモです。</p>

    <div class="memory-log-wrap">
      <table class="memory-log">
        <thead>
          <tr>
            <th>日時</th>
            <th>プロジェクト</th>
            <th>チャット</th>
            <th>内容</th>
            <th>メモ</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2026.9.25 7:06</td>
            <td>ITネッコ</td>
            <td>指示整理案</td>
            <td>ITネッコ項目別生成ページの見直し</td>
            <td>アイデア出しまで</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
