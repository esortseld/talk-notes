<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live History | Talk Notes</title>
  <meta name="description" content="過去ライブ実績とセットリストをカードで整理するページです。">
  <link rel="stylesheet" href="assets/style.css">
  <script src="data/lives.js?v=20260612-02" defer></script>
  <style>
    .lives-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .live-card {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      padding: 24px;
    }

    .live-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--color-muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .live-card h2 {
      font-size: 1.35rem;
    }

    .live-card__venue {
      margin: 8px 0 18px;
      color: var(--color-brown);
      font-weight: 700;
    }

    .setlist {
      display: grid;
      gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .setlist-item {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 12px;
      border-top: 1px solid var(--color-border);
      padding-top: 10px;
    }

    .setlist-number {
      color: var(--color-accent-dark);
      font-weight: 700;
    }

    .setlist-item strong {
      display: block;
      line-height: 1.5;
    }

    .setlist-item p {
      margin: 2px 0 0;
      color: var(--color-muted);
      font-size: 0.9rem;
    }
  </style>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const livesList = document.querySelector("#livesList");
      const resultCount = document.querySelector("#liveResultCount");

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        const date = new Date(`${value}T00:00:00`);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      }

      function createSetlistItem(item) {
        return `
          <li class="setlist-item">
            <span class="setlist-number">${escapeHtml(item.no)}</span>
            <div>
              <strong>${escapeHtml(item.title)}</strong>
              <p>${escapeHtml(item.artist)}</p>
            </div>
          </li>
        `;
      }

      function createLiveCard(live) {
        const setlist = (live.setlist || []).map(createSetlistItem).join("");
        return `
          <article class="live-card">
            <div class="live-card__meta">
              <time datetime="${escapeHtml(live.date)}">${escapeHtml(formatDate(live.date))}</time>
              <span>${escapeHtml(live.band)}</span>
            </div>
            <h2>${escapeHtml(live.event)}</h2>
            <p class="live-card__venue">${escapeHtml(live.venue)}</p>
            <ol class="setlist">
              ${setlist}
            </ol>
          </article>
        `;
      }

      resultCount.textContent = `${lives.length}件`;
      livesList.innerHTML = lives.map(createLiveCard).join("");
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="breadcrumb">
        <a class="back-link" href="index.html">Talk Notesへ戻る</a>
        <a class="back-link" href="songs.html">Songsへ</a>
      </div>
      <p class="site-kicker">Live History</p>
      <h1>Live History</h1>
      <p class="site-subtitle">過去ライブとセットリスト</p>
      <p class="site-description">
        実施済みライブの日付、会場、イベント名、セットリストだけをカードで確認します。
      </p>
    </div>
  </header>

  <main class="container songs-panel">
    <section aria-labelledby="livesHeading">
      <div class="section-heading">
        <h2 id="livesHeading">ライブ実績一覧</h2>
        <p id="liveResultCount" class="result-count" aria-live="polite"></p>
      </div>
      <div id="livesList" class="lives-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Talk Notes</p>
    </div>
  </footer>
</body>
</html>
