<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songs | Talk Notes</title>
  <meta name="description" content="曲名・アーティストから探す楽曲メモ。タイトル、分秒、短いメモ、歌詞リンクを管理します。">
  <link rel="stylesheet" href="assets/style.css?v=20260613-02">
  <script src="data/songs.js?v=20260613-02" defer></script>
  <script src="data/lives.js?v=20260613-01" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const bandFilters = ["すべて", "林檎庵", "sweet pastime", "カンガルーポケット", "その他"];
      const statusFilters = ["すべて", "ライブ済み", "練習中", "覚え中", "未着手", "解釈メモ"];
      const state = {
        band: "すべて",
        status: "すべて",
        query: ""
      };

      const bandList = document.querySelector("#bandList");
      const statusList = document.querySelector("#statusList");
      const searchInput = document.querySelector("#songSearchInput");
      const songsList = document.querySelector("#songsList");
      const resultCount = document.querySelector("#songResultCount");

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalize(value) {
        return String(value ?? "").toLowerCase().trim();
      }

      function compareSongs(a, b) {
        return String(a.titleKana || a.title).localeCompare(String(b.titleKana || b.title), "ja");
      }

      function getLiveLinks(song) {
        return (typeof lives === "undefined" ? [] : lives)
          .filter((live) => (live.setlist || []).some((item) => item.songId === song.id))
          .sort((a, b) => String(a.date).localeCompare(String(b.date)))
          .map((live) => `<a href="lives.html#live-${escapeHtml(live.id)}">${escapeHtml(live.event)}</a>`);
      }

      function renderFilterButtons(target, options, activeValue, dataName) {
        target.innerHTML = options.map((option) => {
          const isActive = activeValue === option;
          return `
            <button class="filter-button${isActive ? " is-active" : ""}" type="button" data-${dataName}="${escapeHtml(option)}">
              ${escapeHtml(option)}
            </button>
          `;
        }).join("");
      }

      function matchesSong(song) {
        const bands = song.bands || [];
        const bandMatch = state.band === "すべて" || bands.includes(state.band);
        const statusMatch = state.status === "すべて" || song.status === state.status;
        const query = normalize(state.query);
        const searchText = normalize([
          song.title,
          song.titleKana,
          song.artist,
          song.memo,
          song.duration,
          song.status,
          ...(song.tags || [])
        ].join(" "));

        return bandMatch && statusMatch && (!query || searchText.includes(query));
      }

      function createSongCard(song, index) {
        const tags = (song.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
        const bands = (song.bands || []).join(" / ") || "未設定";
        const duration = song.duration ? escapeHtml(song.duration) : "分秒未設定";
        const memo = song.memo || "メモ未設定";
        const collectionNumber = String(index + 1).padStart(3, "0");
        const liveLinks = getLiveLinks(song);
        const liveHistory = liveLinks.length
          ? `<p class="song-live-links"><span>ライブ実績：</span>${liveLinks.join(" / ")}</p>`
          : "";
        const lyricsLink = song.lyricsUrl
          ? `<a class="external-link" href="${escapeHtml(song.lyricsUrl)}" target="_blank" rel="noopener">歌詞リンク</a>`
          : "";
        const imageFrame = song.youtubeUrl
          ? `
            <a class="song-card__image-placeholder song-card__image-link" href="${escapeHtml(song.youtubeUrl)}" target="_blank" rel="noopener">
              <span>YouTube</span>
              <small>参考動画へ</small>
            </a>
          `
          : `
            <div class="song-card__image-placeholder" aria-hidden="true">
              <span>Image</span>
            </div>
          `;

        return `
          <article id="song-${escapeHtml(song.id)}" class="song-card song-card--simple collection-card">
            ${imageFrame}
            <p class="song-card__eyebrow">Collection No. ${collectionNumber}</p>
            <h2 class="song-card__title">${escapeHtml(song.title)}</h2>
            <p class="song-card__artist">${escapeHtml(song.artist)}</p>
            <div class="song-card__meta">
              <span>${escapeHtml(bands)}</span>
              <span>${duration}</span>
            </div>
            <p class="song-card__summary">${escapeHtml(memo)}</p>
            ${liveHistory}
            <div class="tag-list" aria-label="タグ">
              ${tags}
            </div>
            <div class="link-row">
              ${lyricsLink}
            </div>
          </article>
        `;
      }

      function renderSongs() {
        const filteredSongs = songs.filter(matchesSong).slice().sort(compareSongs);
        resultCount.textContent = `${filteredSongs.length}曲`;

        if (filteredSongs.length === 0) {
          songsList.innerHTML = '<p class="empty-message">該当する楽曲メモはありません。</p>';
          return;
        }

        songsList.innerHTML = filteredSongs.map(createSongCard).join("");
      }

      bandList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-band]");
        if (!button) return;

        state.band = button.dataset.band;
        renderFilterButtons(bandList, bandFilters, state.band, "band");
        renderSongs();
      });

      statusList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-status]");
        if (!button) return;

        state.status = button.dataset.status;
        renderFilterButtons(statusList, statusFilters, state.status, "status");
        renderSongs();
      });

      searchInput.addEventListener("input", (event) => {
        state.query = event.target.value;
        renderSongs();
      });

      renderFilterButtons(bandList, bandFilters, state.band, "band");
      renderFilterButtons(statusList, statusFilters, state.status, "status");
      renderSongs();
    });
  </script>
</head>
<body class="songs-page">
  <header class="site-header museum-hero">
    <div class="container header-inner">
      <div class="breadcrumb">
        <a class="back-link" href="index.html">Talk Notesへ戻る</a>
        <a class="back-link" href="lives.html">Live Historyへ</a>
      </div>
      <p class="site-kicker museum-hero__label">Song Collection</p>
      <h1>Songs</h1>
      <p class="site-subtitle">楽曲展示室</p>
      <p class="site-description">
        歌詞本文は掲載せず、曲ごとの基本情報、歌詞リンク、ライブ実績、短いメモを整理します。
      </p>
    </div>
  </header>

  <main class="container songs-panel">
    <section class="museum-section museum-section--search" aria-label="楽曲メモの絞り込み">
      <div class="museum-section__heading">
        <p class="museum-section__number">01.</p>
        <div>
          <p class="museum-section__label">Search</p>
          <h2 class="museum-section__title">楽曲を探す</h2>
        </div>
      </div>

      <div class="controls museum-search-panel">
      <div class="search-field">
        <label for="songSearchInput">Search / 検索</label>
        <input id="songSearchInput" type="search" placeholder="曲名・アーティスト・メモ・タグで検索">
      </div>

      <div class="filter-group">
        <div>
          <p class="control-label">バンド・用途</p>
          <div id="bandList" class="filter-list" aria-label="バンドまたは用途"></div>
        </div>

        <div>
          <p class="control-label">進捗</p>
          <div id="statusList" class="filter-list" aria-label="進捗"></div>
        </div>
      </div>
      </div>
    </section>

    <section class="museum-section" aria-labelledby="songsHeading">
      <div class="museum-section__heading museum-section__heading--split">
        <p class="museum-section__number">02.</p>
        <div>
          <p class="museum-section__label">Collection</p>
          <h2 id="songsHeading" class="museum-section__title">楽曲一覧</h2>
        </div>
        <p id="songResultCount" class="result-count" aria-live="polite"></p>
      </div>
      <div id="songsList" class="songs-grid collection-grid"></div>
    </section>

    <section class="museum-section museum-section--note" aria-labelledby="liveLinksHeading">
      <div class="museum-section__heading">
        <p class="museum-section__number">03.</p>
        <div>
          <p class="museum-section__label">Live Links</p>
          <h2 id="liveLinksHeading" class="museum-section__title">ライブ実績とのつながり</h2>
        </div>
      </div>
      <p class="museum-section__description">
        楽曲カード内のライブ名から、該当するLive Historyの記録へ移動できます。
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Talk Notes</p>
    </div>
  </footer>
</body>
</html>
