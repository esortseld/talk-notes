<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk Notes｜雑談から残す、あとで読むメモ</title>
  <meta name="description" content="ChatGPTとの会話の中で出てきた疑問、調べもの、考えたことのうち、後から見返したいものだけを整理して残す場所です。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">Personal archive from conversations</p>
      <h1>Talk Notes</h1>
      <p class="subtitle">雑談から残す、あとで読むメモ</p>
      <p class="lead">ChatGPTとの会話の中で出てきた疑問、調べもの、考えたことのうち、後から見返したいものだけを整理して残す場所です。</p>
    </div>
  </header>

  <main class="wrap main-layout">
    <section class="controls" aria-label="記事の絞り込み">
      <div class="search-box">
        <label for="searchInput">検索</label>
        <input id="searchInput" type="search" placeholder="タイトル・要約・タグで検索">
      </div>
      <div class="category-area">
        <p class="control-label">カテゴリ</p>
        <div id="categoryButtons" class="category-buttons"></div>
      </div>
    </section>

    <section class="intro-card">
      <h2>このサイトの使い方</h2>
      <p>会話の全部を保存する場所ではなく、「これは残す」と決めた話だけを短い記事にして置く場所です。分類は固定カテゴリで大きく分け、タグで横断できるようにします。</p>
    </section>

    <section>
      <div class="section-heading">
        <h2>Notes</h2>
        <p id="resultCount">0件</p>
      </div>
      <div id="notesGrid" class="notes-grid"></div>
      <p id="emptyMessage" class="empty-message" hidden>該当するメモはありません。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <small>© Talk Notes</small>
    </div>
  </footer>

  <script src="data/notes.js"></script>
  <script>
    const categories = ['すべて', '音楽', '言葉', '仕事', 'IT', 'AI', '健康', '生活', '企画', 'その他'];
    const state = { category: 'すべて', query: '' };

    const categoryButtons = document.getElementById('categoryButtons');
    const notesGrid = document.getElementById('notesGrid');
    const resultCount = document.getElementById('resultCount');
    const emptyMessage = document.getElementById('emptyMessage');
    const searchInput = document.getElementById('searchInput');

    function renderCategoryButtons() {
      categoryButtons.innerHTML = '';
      categories.forEach(category => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'category-button';
        button.textContent = category;
        button.dataset.category = category;
        if (category === state.category) button.classList.add('is-active');
        button.addEventListener('click', () => {
          state.category = category;
          render();
        });
        categoryButtons.appendChild(button);
      });
    }

    function matches(note) {
      const q = state.query.trim().toLowerCase();
      const categoryMatch = state.category === 'すべて' || note.category === state.category;
      const text = [note.title, note.summary, note.category, ...(note.tags || [])].join(' ').toLowerCase();
      const queryMatch = !q || text.includes(q);
      return categoryMatch && queryMatch;
    }

    function noteCard(note) {
      const article = document.createElement('article');
      article.className = 'note-card';
      article.innerHTML = `
        <div class="note-meta">
          <span>${note.date}</span>
          <span>${note.category}</span>
        </div>
        <h3>${note.title}</h3>
        <p>${note.summary}</p>
        <div class="tags">${(note.tags || []).map(tag => `<span>${tag}</span>`).join('')}</div>
        <a class="read-link" href="${note.url}">読む</a>
      `;
      return article;
    }

    function render() {
      renderCategoryButtons();
      const filtered = notes.filter(matches);
      notesGrid.innerHTML = '';
      filtered.forEach(note => notesGrid.appendChild(noteCard(note)));
      resultCount.textContent = `${filtered.length}件`;
      emptyMessage.hidden = filtered.length !== 0;
    }

    searchInput.addEventListener('input', event => {
      state.query = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
