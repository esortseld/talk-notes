<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk Notes</title>
  <meta name="description" content="雑談、調べもの、制作ログ、楽曲メモをあとで読める形に整理する個人用ノートです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20260614-01">
  <link rel="stylesheet" href="assets/entry-image.css?v=20260623-02">
  <link rel="stylesheet" href="assets/mobile-polish.css?v=20260622-01">
  <link rel="stylesheet" href="assets/invisible-work.css?v=20260623-01">
  <script src="data/notes.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const categories = ["すべて", "音楽", "言葉", "仕事", "IT", "AI", "健康", "生活", "企画", "その他"];
      const state = {
        category: "すべて",
        query: ""
      };

      const categoryList = document.querySelector("#categoryList");
      const searchInput = document.querySelector("#searchInput");
      const notesList = document.querySelector("#notesList");
      const resultCount = document.querySelector("#resultCount");

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalize(value) {
        return String(value).toLowerCase().trim();
      }

      function formatDate(value) {
        const date = new Date(`${value}T00:00:00`);
        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return date.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      }

      function renderCategories() {
        categoryList.innerHTML = categories.map((category) => {
          const isActive = state.category === category;
          return `
            <button class="filter-button${isActive ? " is-active" : ""}" type="button" data-category="${escapeHtml(category)}">
              ${escapeHtml(category)}
            </button>
          `;
        }).join("");
      }

      function matchesNote(note) {
        const categoryMatch = state.category === "すべて" || note.category === state.category;
        const query = normalize(state.query);
        const searchText = normalize([
          note.title,
          note.summary,
          note.category,
          ...(note.tags || [])
        ].join(" "));

        return categoryMatch && (!query || searchText.includes(query));
      }

      function createNoteCard(note) {
        const tags = (note.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");

        return `
          <article class="note-card">
            <div class="note-card__meta">
              <time datetime="${escapeHtml(note.date)}">${escapeHtml(formatDate(note.date))}</time>
              <span>${escapeHtml(note.category)}</span>
            </div>
            <h2 class="note-card__title">${escapeHtml(note.title)}</h2>
            <p class="note-card__summary">${escapeHtml(note.summary)}</p>
            <div class="tag-list" aria-label="タグ">
              ${tags}
            </div>
            <a class="read-link" href="${escapeHtml(note.url)}">読む</a>
          </article>
        `;
      }

      function renderNotes() {
        const filteredNotes = notes.filter(matchesNote);
        resultCount.textContent = `${filteredNotes.length}件`;

        if (filteredNotes.length === 0) {
          notesList.innerHTML = '<p class="empty-message">該当するメモはありません。</p>';
          return;
        }

        notesList.innerHTML = filteredNotes.map(createNoteCard).join("");
      }

      categoryList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-category]");
        if (!button) {
          return;
        }

        state.category = button.dataset.category;
        renderCategories();
        renderNotes();
      });

      searchInput.addEventListener("input", (event) => {
        state.query = event.target.value;
        renderNotes();
      });

      renderCategories();
      renderNotes();
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <p class="site-kicker">Personal archive</p>
      <h1>Talk Notes</h1>
      <p class="site-subtitle">制作ログ、調べもの、学習メモをあとで読む</p>
      <p class="site-description">
        日々の会話や作業の中で出てきた内容を、あとで読み返せる形に整理した個人アーカイブです。
      </p>
    </div>
  </header>

  <main class="container">
    <section class="entry-section" aria-label="主要セクション">
      <a class="entry-card entry-card--image entry-card--meg-v0" href="https://esortseld.github.io/meg_v0/" aria-label="Meg_v0へ">
        <img class="entry-card--image__visual" src="https://esortseld.github.io/meg_v0/assets/img/avatar.png" alt="">
        <span class="entry-card--image__title">Meg_v0</span>
      </a>

      <a class="entry-card entry-card--image entry-card--suyaneko" href="https://esortseld.github.io/suyaneko_bunko/" aria-label="すやネコ文庫へ">
        <img class="entry-card--image__visual" src="https://esortseld.github.io/suyaneko_bunko/assets/suyaneko-main.jpg" alt="">
        <span class="entry-card--image__title">すやネコ文庫</span>
      </a>

      <a class="entry-card entry-card--image entry-card--neko-gyosho" href="https://esortseld.github.io/neko_gyosho/" aria-label="ねこ行書へ">
        <img class="entry-card--image__visual" src="assets/img/nego-gyosho_image.png" alt="">
        <span class="entry-card--image__title">ねこ行書</span>
      </a>

      <a class="entry-card entry-card--image entry-card--invisible-note" href="invisible-work/index.html" aria-label="インビジブルノートへ">
        <img class="entry-card--image__visual" src="assets/img/invisible-note_image.png" alt="インビジブルノートのイメージイラスト">
        <span class="entry-card--image__content">
          <span class="entry-card--image__title">インビジブルノート</span>
          <span class="entry-card--image__description">秘書という見えざるお仕事について、あれこれ考えております。</span>
          <span class="entry-card--image__link">読む</span>
        </span>
      </a>

      <a class="entry-card" href="#notes">
        <span class="entry-card__label">Notes</span>
        <h2>雑多メモ</h2>
        <p>会話、調べもの、制作ログ、考えたことを短い記事として残します。</p>
        <span class="entry-card__link">Notesを見る</span>
      </a>
    </section>

    <section id="notes" class="notes-panel" aria-label="雑多メモ">
      <div class="section-heading">
        <div>
          <p class="section-kicker">Notes</p>
          <h2>雑多メモ</h2>
        </div>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>

      <div class="compact-controls" aria-label="雑多メモの絞り込み">
        <div class="search-field">
          <label for="searchInput">検索</label>
          <input id="searchInput" type="search" placeholder="タイトル・要約・タグで検索">
        </div>
        <div>
          <p class="control-label">カテゴリ</p>
          <div id="categoryList" class="filter-list" aria-label="カテゴリ一覧"></div>
        </div>
      </div>

      <div id="notesList" class="notes-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Talk Notes</p>
    </div>
  </footer>
</body>
</html>
